# Nginx configuration for AnyLab - anylab.dpdns.org
# This file should be placed in /etc/nginx/sites-available/anylab
# and symlinked to /etc/nginx/sites-enabled/anylab

# HTTP server
server {
    listen 80;
    listen [::]:80;
    server_name anylab.dpdns.org;

    # ACME challenge for Let's Encrypt (must come before redirect)
    location /.well-known/acme-challenge/ {
        root /opt/homebrew/var/www/html;
        try_files $uri =404;
        allow all;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name anylab.dpdns.org;

    # SSL certificate paths (will be set up with Let's Encrypt)
    # Update these after running certbot
    ssl_certificate /etc/letsencrypt/live/anylab.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anylab.dpdns.org/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers (simplified for debugging)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # add_header X-Content-Type-Options "nosniff" always;
    # add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/anylab_access.log;
    error_log /var/log/nginx/anylab_error.log;

    # Client body size (for file uploads)
    client_max_body_size 100M;

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ACME challenge for Let's Encrypt (must come before other locations)
    location /.well-known/acme-challenge/ {
        root /opt/homebrew/var/www/html;
        try_files $uri =404;
        allow all;
    }

    # API requests - proxy to Django backend (port 8001)
    # Must come before catch-all location block
    # Use exact match prefix to ensure it takes precedence
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # Don't cache API responses
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Admin panel - proxy to Django backend
    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_redirect off;
    }

    # Media files - proxy to Django backend
    location /media/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_redirect off;
    }

    # Static files - proxy to Django backend
    location /static/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_redirect off;
    }

    # Login/logout endpoints - proxy to Django backend
    location ~ ^/(login|logout|dashboard)/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_redirect off;
    }

    # All other requests - proxy to React frontend (port 3000)
    # Note: /api/ location block above handles all API requests
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_redirect off;
    }
}

