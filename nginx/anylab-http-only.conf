# Nginx configuration for AnyLab - anylab.dpdns.org
# HTTP-only version for Cloudflare Flexible SSL
# This version works without SSL certificates on the origin server

# HTTP server (Cloudflare handles HTTPS termination)
server {
    listen 80;
    listen [::]:80;
    server_name anylab.dpdns.org;

    # Logging (Homebrew nginx uses /opt/homebrew/var/log/nginx/)
    access_log /opt/homebrew/var/log/nginx/anylab_access.log;
    error_log /opt/homebrew/var/log/nginx/anylab_error.log;

    # Client body size (for file uploads)
    client_max_body_size 100M;

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ACME challenge for Let's Encrypt (for future SSL setup)
    location /.well-known/acme-challenge/ {
        root /opt/homebrew/var/www/html;
        try_files $uri =404;
        allow all;
    }

    # API requests - proxy to Django backend (port 8000)
    # Must come before catch-all location block
    # Use exact match prefix to ensure it takes precedence
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # Don't cache API responses
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Admin panel - proxy to Django backend
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_redirect off;
    }

    # Media files - proxy to Django backend
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_redirect off;
    }

    # Static files - proxy to Django backend
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_redirect off;
    }

    # Login/logout endpoints - proxy to Django backend
    location ~ ^/(login|logout|dashboard)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_redirect off;
    }

    # Manifest.json - proxy to frontend (must come before catch-all)
    location = /manifest.json {
        proxy_pass http://127.0.0.1:3000;
        proxy_redirect off;
        add_header Content-Type "application/manifest+json" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # PDF worker file - ensure correct MIME type (must come before catch-all)
    location = /pdf.worker.min.mjs {
        proxy_pass http://127.0.0.1:3000;
        proxy_redirect off;
        # Force correct MIME type
        add_header Content-Type "application/javascript" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Preserve original headers from backend
        proxy_pass_header Content-Type;
    }

    # All other requests - proxy to React frontend (port 3000)
    # Note: /api/ location block above handles all API requests
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_redirect off;
    }
}

