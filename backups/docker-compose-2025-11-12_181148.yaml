name: anylab103
services:
  neo4j:
    container_name: anylab_neo4j
    deploy:
      resources:
        limits:
          cpus: 2
          memory: "2147483648"
        reservations:
          memory: "1073741824"
    environment:
      NEO4J_AUTH: neo4j/anylab_neo4j_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_checkpoint_interval_time: 15m
      NEO4J_dbms_checkpoint_interval_tx: "100000"
      NEO4J_dbms_connector_bolt_listen__address: 0.0.0.0:7687
      NEO4J_dbms_connector_http_listen__address: 0.0.0.0:7474
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512m
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --tries=1 --spider http://localhost:7474 || exit 1
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 40s
    image: neo4j:5.15-community
    networks:
      anylab_network: null
    ports:
      - mode: ingress
        target: 7474
        published: "7474"
        protocol: tcp
      - mode: ingress
        target: 7687
        published: "7687"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: neo4j_data
        target: /data
        volume: {}
      - type: volume
        source: neo4j_logs
        target: /logs
        volume: {}
      - type: volume
        source: neo4j_import
        target: /var/lib/neo4j/import
        volume: {}
      - type: volume
        source: neo4j_plugins
        target: /plugins
        volume: {}
  postgres:
    command:
      - postgres
      - -c
      - shared_preload_libraries=vector
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=50
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    container_name: anylab_postgres
    deploy:
      resources:
        limits:
          cpus: 1
          memory: "268435456"
        reservations:
          memory: "134217728"
    environment:
      POSTGRES_DB: anylab
      POSTGRES_EFFECTIVE_CACHE_SIZE: 128MB
      POSTGRES_MAINTENANCE_WORK_MEM: 32MB
      POSTGRES_MAX_CONNECTIONS: "50"
      POSTGRES_PASSWORD: password
      POSTGRES_SHARED_BUFFERS: 64MB
      POSTGRES_USER: postgres
      POSTGRES_WORK_MEM: 4MB
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      timeout: 5s
      interval: 10s
      retries: 5
    image: pgvector/pgvector:pg15
    networks:
      anylab_network: null
    ports:
      - mode: ingress
        target: 5432
        published: "5433"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
        volume: {}
  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 100mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "900"
      - "1"
      - --save
      - "300"
      - "10"
      - --save
      - "60"
      - "10000"
    container_name: anylab_redis
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: "134217728"
        reservations:
          memory: "33554432"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 3s
      interval: 10s
      retries: 5
    image: redis:7-alpine
    networks:
      anylab_network: null
    ports:
      - mode: ingress
        target: 6379
        published: "6379"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: redis_data
        target: /data
        volume: {}
networks:
  anylab_network:
    name: anylab103_anylab_network
    driver: bridge
volumes:
  neo4j_data:
    name: anylab103_neo4j_data
    driver: local
  neo4j_import:
    name: anylab103_neo4j_import
    driver: local
  neo4j_logs:
    name: anylab103_neo4j_logs
    driver: local
  neo4j_plugins:
    name: anylab103_neo4j_plugins
    driver: local
  postgres_data:
    name: anylab103_postgres_data
    driver: local
  redis_data:
    name: anylab103_redis_data
    driver: local
