input {
  file {
    path => "/var/log/anylab/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json {
      charset => "UTF-8"
    }
  }
}

filter {
  if [correlation_id] {
    mutate {
      add_field => { "[@metadata][correlation_id]" => "%{correlation_id}" }
    }
  }
  
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
  
  mutate {
    remove_field => [ "timestamp" ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "anylab-logs-%{+YYYY.MM.dd}"
    document_id => "%{[@metadata][correlation_id]}"
  }
  
  stdout {
    codec => rubydebug
  }
}

