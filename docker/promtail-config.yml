server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: anylab-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: anylab-backend
          environment: ${ENVIRONMENT:-development}
          service: django
          __path__: /var/log/anylab/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            module: module
            correlation_id: correlation_id
      - labels:
          level:
          module:
          correlation_id:
      - timestamp:
          source: timestamp
          format: RFC3339Nano

